<div class="card">

  <div class="principal-card">
    <div class="circle" *ngIf="icon">
      <ng-container *ngComponentOutlet="icon"></ng-container>
    </div>
    <div class="first-content">
      <h3>{{title}}</h3>
      <h5>{{description}}</h5>
    </div>
  </div>
  <hr class="divider">
</div>
